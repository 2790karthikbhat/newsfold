[project]
name = "newsfold"
version = "0.1.0"
description = "Turn multi-source, multi-language news into one calm, translated, ranked digest."
authors = [{ name = "Karthik Bhat", email = "52274631+2790karthikbhat@users.noreply.github.com" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.13,<4.0"
keywords = ["news", "rss", "digest", "google-news", "translation", "llm", "summarization"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content :: News/Diary",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]
dependencies = [
    "feedparser>=6.0.11,<7",
    "httpx>=0.28,<0.29",
    "trafilatura>=2.0,<3",
    "lxml>=5.3,<6",
    "googlenewsdecoder>=0.1.7,<0.2",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.14,<2",
    "pyyaml>=6.0,<7",
    "python-dotenv>=1.0,<2",
    "jinja2>=3.1,<4",
    "typer>=0.15,<0.16",
    "rich>=13",
    "python-dateutil>=2.9,<3",
    "fastapi>=0.141.1,<0.142",
    "uvicorn>=0.52.4,<0.53",
    "python-multipart>=0.0.32,<0.0.33",
    # googlenewsdecoder 0.1.x imports selectolax.parser (the Modest backend), which
    # selectolax 1.0 removed; pip/pipx ignore poetry.lock, so pin it here.
    "selectolax>=0.3,<1",
]

[project.urls]
Homepage = "https://github.com/2790karthikbhat/newsfold"
Repository = "https://github.com/2790karthikbhat/newsfold"
Issues = "https://github.com/2790karthikbhat/newsfold/issues"

[project.scripts]
digest = "newsfold.cli:app"

[tool.poetry]
packages = [{ include = "newsfold", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
black = "^24.10"
ruff = "^0.9"
mypy = "^1.14"
pre-commit = "^4.0"
types-pyyaml = "^6.0"
types-python-dateutil = "^2.9"

[build-system]
requires = ["poetry-core>=2.0,<3.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP", "C4", "SIM"]
# S101: assert is fine in tests (configured per-file below)

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.lint.flake8-bugbear]
# typer.Option(...) as a default is already exempt from B008 by ruff's built-in
# list; typer.Argument(...) isn't, but it's the same idiomatic Typer pattern.
extend-immutable-calls = ["typer.Argument"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
packages = ["newsfold"]

[[tool.mypy.overrides]]
module = ["feedparser", "googlenewsdecoder", "trafilatura", "lxml", "lxml.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
