# Autogenerated Alembic migrations are excluded from lint/type checks — Alembic
# formats them itself and `op`/`sa` are injected at runtime.
exclude: ^src/newsfold/migrations/versions/

repos:
  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.2
    hooks:
      - id: ruff
        args: [--fix]

  # mypy runs from the project venv (via poetry.toml's in-project .venv) so it can
  # see sqlalchemy, httpx, etc. The mirrors-mypy hook runs in an isolated env and
  # can't, which is why this is a local/system hook instead.
  - repo: local
    hooks:
      - id: mypy
        name: mypy (strict, project venv)
        entry: .venv/bin/mypy
        language: system
        types: [python]
        pass_filenames: false
        always_run: true
