name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  POETRY_VERSION: "2.1.4"  # the version that generated poetry.lock

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read Python version from pyproject.toml
        id: py
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import re, tomllib
          spec = tomllib.load(open("pyproject.toml", "rb"))["project"]["requires-python"]
          print("version=" + re.search(r">=\s*([0-9]+\.[0-9]+)", spec).group(1))
          PY

      - name: Install Poetry
        run: pipx install "poetry==${POETRY_VERSION}"

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ steps.py.outputs.version }}
          cache: poetry

      - name: Install dependencies
        run: |
          poetry env use "${{ steps.py.outputs.version }}"
          poetry install --no-interaction

      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ steps.py.outputs.version }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Lint (black, ruff, mypy strict via pre-commit)
        run: poetry run pre-commit run --all-files --show-diff-on-failure

      - name: Tests
        run: poetry run pytest -q

      - name: Build wheel + sdist
        run: poetry build
